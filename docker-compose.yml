version: '3.8'

services:
  api:
    build: .
    container_name: school_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis            # ✅ Redis added here
    volumes:
      - .:/app
    restart: always

  mongo:
    image: mongo:4.4
    container_name: school_mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    restart: always

  redis:                 # ✅ NEW SERVICE
    image: redis:7
    container_name: school_redis
    ports:
      - "6379:6379"
    restart: always
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    depends_on:
      - api

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
